name: Validate installer manifest

# Runs the Pester suite that guards the embedded agent manifest and the
# generated workspace structure. Triggers on every push and pull request so a
# broken change is flagged (and, with branch protection, blocked from merge).
on:
  push:
    paths:
      - 'fabric-agentic-installer/**'
      - 'schema/**'
      - 'tests/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CLI-FUNCTIONALITIES.md'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'fabric-agentic-installer/**'
      - 'schema/**'
      - 'tests/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CLI-FUNCTIONALITIES.md'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  pester:
    name: Pester (Windows / PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester v5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $false
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testresults.xml'
          $r = Invoke-Pester -Configuration $config
          # Counts as a public check-run annotation and a job summary (readable without the raw logs).
          $line = "PowerShell $($PSVersionTable.PSVersion) | Pester $((Get-Module Pester).Version) | passed=$($r.PassedCount) failed=$($r.FailedCount) skipped=$($r.SkippedCount) notRun=$($r.NotRunCount) total=$($r.TotalCount) | failedContainers=$($r.FailedContainersCount)"
          Write-Host "::notice title=Pester results::$line"
          "### Pester results`n`n$line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($r.Result -ne 'Passed') { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testresults.xml
